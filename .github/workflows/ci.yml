name: CI

on:
  push:
    branches: [master, beta-branch, "claude/**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build -- --zip
      - name: Lint Firefox build
        # Non-blocking until Phase 4 retires the cloud scripts (cloud/itunes.js has a top-level return); see REVAMP.md
        continue-on-error: true
        run: npx web-ext lint --source-dir dist/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: web-to-plex-${{ github.sha }}
          path: dist/*.zip

  release:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-to-plex-${{ github.sha }}
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" web-to-plex.zip web-to-plex-firefox.zip --clobber --repo "${{ github.repository }}"
